# Automatiska kontroller vid varje push och pull request.
# Stoppar inte Vercel, men visar en röd markering på GitHub om något gått sönder.
name: Kontroller

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typer, lint, tester, bygge och klicktester
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera paket
        run: npm ci

      - name: TypeScript (0 fel)
        run: npm run typecheck

      # Designvakten, ESLint och knip (hittar död kod: oanvända filer, exporter och paket)
      - name: Kodgranskning (lint + död kod)
        run: npm run lint

      - name: Tester för räknemotorn
        run: npm test

      - name: Bygg appen
        run: npx vite build

      # Webbläsaren sparas mellan körningar. Om Ubuntus paketserver krånglar
      # (hänt en gång) försöker vi igen utan systempaket – de finns redan på GitHubs maskiner.
      - name: Hämta sparad webbläsare
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installera webbläsare för klicktester
        timeout-minutes: 6
        run: |
          timeout 240 npx playwright install --with-deps chromium \
            || npx playwright install chromium

      - name: Klicktester (demoläget)
        run: npm run e2e

      - name: Spara rapport om klicktester misslyckas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rapport
          path: playwright-report/
          retention-days: 7
