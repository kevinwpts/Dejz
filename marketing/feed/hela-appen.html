<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;font-family:Inter,sans-serif}
/* Feed 1080 × 1350. Hela hemskärmen syns – telefonen rak och centrerad. */
#c{position:relative;width:1080px;height:1350px;overflow:hidden;color:#fff;

<body>
<div id="c">
  <div class="top">
    <img class="logo" src="file:///C:/Users/kevin/Desktop/Dejz/public/dejz_mork.png" alt="Dejz">

  </div>
  <div class="phone"><div class="screen"><img src="file:///C:/Users/kevin/Desktop/Dejz/public/screens/home.png" alt=""><div class="island"></div></div></div>
  <div class="cta"><span>Gratis väntelista ·</span> dejz.se</div>
</div>
</body></html>
