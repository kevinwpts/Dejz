<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;font-family:Inter,sans-serif}
#c{position:relative;width:1080px;height:1350px;overflow:hidden;background:#3F22C9;color:#fff}
.photo{position:absolute;left:-877px;top:240px;height:1300px;width:auto}
/* Lugn lila yta upptill för rubriken som tonar ut över fotot */
.top{position:absolute;left:0;right:0;top:0;height:560px;background:linear-gradient(180deg,#3A20B8 0%,#3A20B8 46%,rgba(58,32,184,.85) 58%,rgba(58,32,184,0) 100%)}
.bot{position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(0deg,rgba(30,18,90,.55) 0%,rgba(30,18,90,0) 100%)}
.h{position:absolute;left:72px;right:72px;top:80px;font-weight:700;letter-spacing:-0.045em;line-height:1.02}
.h .a{font-size:96px}
.h .b{margin-top:16px;font-size:58px;color:#D9D0FF;line-height:1.08}
/* Ren, rak widget – samma marginaler som rubriken */
.card{position:absolute;left:72px;right:72px;bottom:72px;padding:30px 36px 28px;border-radius:32px;background:#fff;color:#16141F;box-shadow:0 30px 60px -24px rgba(10,6,40,.6)}
.card .r{display:flex;justify-content:space-between;align-items:center;font-size:32px;font-weight:500;color:#6B6880}
.card .r img{height:34px;width:auto}
.card .v{margin-top:10px;font-size:76px;font-weight:700;letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums}
.card .bar{margin-top:20px;height:12px;border-radius:99px;background:#ECE9F8;overflow:hidden}
.card .bar i{display:block;height:100%;width:22%;border-radius:99px;background:linear-gradient(90deg,#7356FF,#5B3DF5)}
.card .p{margin-top:14px;font-size:32px;font-weight:500;color:#6B6880;font-variant-numeric:tabular-nums}
</style></head>
<body>
<div id="c">
  <img class="photo" src="file:///C:/Users/kevin/Desktop/Dejz/marketing/foto-soffa.webp" alt="">
  <div class="top"></div>
  <div class="bot"></div>
  <div class="h">
    <div class="a">Saldot säger 8&nbsp;450&nbsp;kr.</div>
    <div class="b">Men du har bara 1&nbsp;240&nbsp;kr<br>kvar till nästa lön.</div>
  </div>
  <div class="card">
    <div class="r"><span>Kvar att spendera</span><img src="file:///C:/Users/kevin/Desktop/Dejz/public/dejz_mork.png" style="filter:invert(27%) sepia(90%) saturate(4000%) hue-rotate(245deg) brightness(95%)" alt="Dejz"></div>
    <div class="v">1 240 kr</div>
    <div class="bar"><i></i></div>
    <div class="p">6 dagar till nästa lön</div>
  </div>
</div>
</body></html>
