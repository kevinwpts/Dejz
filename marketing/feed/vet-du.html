<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;font-family:Inter,sans-serif}
/* Feed 1080 × 1350. Fråga upptill, svaret (hemkortet) nedanför. Allt på samma vänsterkant (72 px). */
#c{position:relative;width:1080px;height:1350px;overflow:hidden;background:#F5F4FA;color:#16141F}
.logo{position:absolute;left:72px;top:72px;height:44px;width:auto;
  filter:invert(27%) sepia(90%) saturate(4000%) hue-rotate(245deg) brightness(95%)}
.h{position:absolute;left:72px;right:72px;top:172px;font-size:100px;font-weight:700;letter-spacing:-0.045em;line-height:1.04}
.s{position:absolute;left:72px;right:72px;top:518px;font-size:40px;font-weight:500;color:#5E5A72;letter-spacing:-0.01em;line-height:1.3}
.s b{color:#16141F;font-weight:700}
/* Hemkortet – samma uppbyggnad som i appen */
.card{position:absolute;left:72px;right:72px;top:660px;padding:44px 48px 40px;border-radius:44px;color:#fff;
  background:linear-gradient(135deg,#7356FF 0%,#5B3DF5 50%,#3F22C9 100%);
  box-shadow:0 40px 80px -30px rgba(63,34,201,.55)}
.row{display:flex;justify-content:space-between;font-size:32px;font-weight:500;color:rgba(255,255,255,.82)}
.v{margin-top:14px;font-size:124px;font-weight:700;letter-spacing:-0.045em;line-height:1;font-variant-numeric:tabular-nums}
.bar{margin-top:30px;height:16px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;width:22%;border-radius:99px;background:#fff}
.br{margin-top:36px;padding-top:30px;border-top:1px solid rgba(255,255,255,.22);display:grid;grid-template-columns:1fr 1fr 1fr}
.br div{font-size:28px;font-weight:500;color:rgba(255,255,255,.75)}
.br div + div{padding-left:28px;border-left:1px solid rgba(255,255,255,.22)}
.br b{display:block;margin-top:8px;font-size:34px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.br .in b{color:#A7F3C9}
.cta{position:absolute;left:72px;right:72px;bottom:72px;font-size:38px;font-weight:700;color:#5B3DF5;letter-spacing:-0.02em}
.cta span{color:#5E5A72;font-weight:500}
</style></head>
<body>
<div id="c">
  <img class="logo" src="file:///C:/Users/kevin/Desktop/Dejz/public/dejz_mork.png" alt="Dejz">
  <div class="h">Vet du vad du har<br>kvar att spendera<br>till nästa lön?</div>
  <div class="s"><b>Dejz vet.</b> Räkningarna är redan avdragna.</div>
  <div class="card">
    <div class="row"><span>Kvar att spendera</span><span>6 dagar till lön</span></div>
    <div class="v">1&nbsp;240&nbsp;kr</div>
    <div class="bar"><i></i></div>
    <div class="br">
      <div class="in">Inkomst<b>+24&nbsp;800&nbsp;kr</b></div>
      <div>Fasta<b>−19&nbsp;200&nbsp;kr</b></div>
      <div>Rörligt<b>−4&nbsp;360&nbsp;kr</b></div>
    </div>
  </div>
  <div class="cta"><span>Gratis väntelista ·</span> dejz.se</div>
</div>
</body></html>
