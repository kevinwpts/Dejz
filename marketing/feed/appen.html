<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;font-family:Inter,sans-serif}
/* Feed 1080 × 1350. Allt centrerat på en mittlinje, telefonen rak och beskuren av nederkanten. */
#c{position:relative;width:1080px;height:1350px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,#7356FF 0%,#5B3DF5 45%,#3F22C9 100%)}

.screen img{display:block;width:100%;height:auto}
.island{position:absolute;left:50%;top:22px;width:150px;height:42px;transform:translateX(-50%);border-radius:99px;background:#0E0B1F}

  <div class="phone"><div class="screen"><img src="file:///C:/Users/kevin/Desktop/Dejz/public/screens/home.png" alt=""><div class="island"></div></div></div>
</div>
</body></html>
