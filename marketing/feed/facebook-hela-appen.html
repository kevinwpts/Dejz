<!doctype html><html lang="sv"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;font-optical-sizing:auto}
#ad{position:relative;width:1080px;height:1350px;overflow:hidden;color:#fff;
 background:radial-gradient(60% 40% at 50% 62%,rgba(255,255,255,.18),transparent 70%),radial-gradient(70% 45% at 100% 0%,rgba(255,255,255,.16),transparent 60%),linear-gradient(160deg,#7356FF 0%,#5B3DF5 48%,#3F22C9 100%)}
.logo{position:absolute;top:72px;left:50%;transform:translateX(-50%);height:46px}
h1{position:absolute;top:156px;left:60px;right:60px;text-align:center;font-size:88px;line-height:1.0;font-weight:700;letter-spacing:-0.045em}
.sub{position:absolute;top:356px;left:120px;right:120px;text-align:center;font-size:36px;line-height:1.35;letter-spacing:-0.015em;color:rgba(255,255,255,.88)}
.cta{position:absolute;top:478px;left:50%;transform:translateX(-50%);background:#fff;color:#3F22C9;font-weight:700;font-size:34px;letter-spacing:-0.02em;padding:22px 44px;border-radius:999px;white-space:nowrap;box-shadow:0 18px 40px -18px rgba(20,8,80,.6)}
.phone{position:absolute;background:#0E0C18;border-radius:9.5%/4.4%;padding:1.9%;box-shadow:0 50px 110px -30px rgba(20,8,80,.75)}
.phone img{display:block;width:100%;border-radius:8.2%/3.8%}
.island{position:absolute;top:2.9%;left:50%;transform:translateX(-50%);width:30%;height:2.6%;background:#0E0C18;border-radius:99px}
.side{width:330px;top:700px}
.left{left:-30px}
.right{right:-30px}
.center{width:430px;left:50%;transform:translateX(-50%);top:630px}
</style></head><body>
<div id="ad">
  <img class="logo" src="../../public/dejz_mork.png" style="filter:brightness(0) invert(1)" alt="dejz">
  <h1>Se vad du har kvar<br>till nästa lön.</h1>
  <div class="sub">Räkningar och sparande dras av direkt – så du alltid vet vad du kan spendera.</div>
  <div class="cta">Skapa konto gratis · dejz.se</div>
  <div class="phone side left"><img src="../../public/screens/ekonomi.png"><span class="island"></span></div>
  <div class="phone side right"><img src="../../public/screens/analys.png"><span class="island"></span></div>
  <div class="phone center"><img src="../../public/screens/home.png"><span class="island"></span></div>
</div></body></html>
