<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dejz" />
    <meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090D16" media="(prefers-color-scheme: dark)" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dejz_dark_mode');
          var isDark = saved === 'dark';
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.backgroundColor = '#090D16';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.backgroundColor = '#F2F4F8';
          }
        } catch (e) {}
      })();
    </script>

    <!-- SEO Meta Tags -->
    <title>Dejz – Äntligen koll på ekonomin från lön till lön</title>
    <meta name="description" content="Samla dina inkomster, fasta utgifter och sparande. Registrera dina köp och se vad du har kvar att spendera fram till nästa lön." />

    <!-- Fonts - Plus Jakarta Sans & JetBrains Mono -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

      }

    <style>
      :root {
        color-scheme: light dark;
      }
      html, body {
        min-height: 100%;
        margin: 0;
        padding: 0;
      }
      html.dark, body.dark {
        background-color: #090D16 !important;
        background: #090D16;
      }
      html.light, body.light, html:not(.dark), body:not(.dark) {
        background-color: #F2F4F8 !important;
        background: #F2F4F8;
      }
    </style>
  </head>
