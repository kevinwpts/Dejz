    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dejz_dark_mode');
          var onboardingDone = localStorage.getItem('dejz_onboarding_completed') === 'true';
          var isDark = saved === 'dark' && onboardingDone;
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.backgroundColor = '#191919';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.backgroundColor = '#F2F0F0';
          }
        } catch (e) {}
      })();
    </script>
