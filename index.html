<!DOCTYPE html>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dejz" />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0A12" media="(prefers-color-scheme: dark)" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dejz_dark_mode');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? (saved === 'dark') : prefersDark;
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.backgroundColor = '#0B0A12';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.backgroundColor = '#FAFAF8';
          }
        } catch (e) {}
      })();
    </script>

    <!-- SEO Meta Tags -->
    <title>Dejz – Få pengarna att räcka till nästa lön</title>
    <meta name="description" content="Dejz hjälper dig se hur mycket du faktiskt har att spendera efter räkningar och sparande – och få pengarna att räcka hela vägen till nästa lön." />

    <style>
