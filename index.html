<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dejz" />
    <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dejz_dark_mode');
          var isDark = saved === 'dark';
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.backgroundColor = '#0B0C0E';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.backgroundColor = '#F4F5F7';
          }
        } catch (e) {}
      })();
    </script>

    <!-- SEO Meta Tags -->
    <title>Dejz – Äntligen koll på ekonomin från lön till lön</title>

    <!-- Fonts - Plus Jakarta Sans & Sora -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
      :root {
        color-scheme: light dark;
      }
      html, body {
        min-height: 100%;
        margin: 0;
        padding: 0;
      }
      html.dark, body.dark {
        background-color: #0B0C0E !important;
        background: #0B0C0E;
      }
      html.light, body.light, html:not(.dark), body:not(.dark) {
        background-color: #F4F5F7 !important;
        background: #F4F5F7;
      }
    </style>
  </head>
